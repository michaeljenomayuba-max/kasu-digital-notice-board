<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign Up | KASU Notice Board</title>
    <link rel="stylesheet" href="styles/student-sign-in.css" />
  </head>
  <body>
    <main class="page">
      <div class="auth-card">
        <div class="logo-container">
          <img class="logo" src="images/kasu-logo.png" alt="KASU logo" />
        </div>
        <p class="welcome-text">Welcome to the KASU Notice Board</p>
        <h1 class="auth-title">Sign in</h1>
        <form class="auth-form" action="feed.html">
          <div class="form-group">
            <label for="matric-number">Matric number</label>
            <input
              type="text"
              id="matric-number"
              name="matric-number"
              placeholder="KASU/YY/DEPT/NN"
            />
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Email" />
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Password"
            />
          </div>
          <button class="auth-button" type="submit">Sign in</button>
        </form>
        <p class="auth-switch">
          Don't have an account? <a href="student-sign-up.html">Sign up</a>
        </p>
      </div>
    </main>
  </body>
</html>
